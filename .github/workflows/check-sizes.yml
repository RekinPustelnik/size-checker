name: 👕 Sprawdź rozmiary

on:
  push:
    branches:
      - main
  schedule:
    # Co 10 minut (zbyt częste odpytywanie np. co 5 min może być ignorowane przez darmowe serwery GitHub)
    - cron: '*/10 * * * *'
  # Możliwość ręcznego uruchomienia z zakładki Actions
  workflow_dispatch:

jobs:
  check-sizes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instaluj zależności
        run: npm ci

      - name: Sprawdź dostępność rozmiarów
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run check
